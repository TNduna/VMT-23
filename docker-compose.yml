services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vmt23}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-vmt23}
      # Performance tuning for local dev
      POSTGRES_INITDB_ARGS: "-c shared_buffers=256MB -c effective_cache_size=1GB"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vmt23} -d ${POSTGRES_DB:-vmt23}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - vmt23-net

  vmt23:
    build:
      context: .
      dockerfile: Dockerfile
    image: vmt23:local
    container_name: vmt23-main
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database connection
      ARTEX_PG_DSN: postgres://vmt23:${POSTGRES_PASSWORD}@postgres:5432/vmt23?sslmode=disable

      # LLM provider configuration
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      VMT23_LLM_PROVIDER: ${VMT23_LLM_PROVIDER:-}
      VMT23_LLM_MODEL: ${VMT23_LLM_MODEL:-}
      VMT23_LLM_BASE_URL: ${VMT23_LLM_BASE_URL:-}
      VMT23_LLM_PROXY: ${VMT23_LLM_PROXY:-}
      
      # App config
      LOG_LEVEL: ${LOG_LEVEL:-info}
    
    ports:
      - "8787:8787"        # Main UI (public)
      - "127.0.0.1:8788:8788"  # Proxy (localhost only)
    
    volumes:
      - ./data:/app/data      # Persistent: SQLite + JWT key
      - ./skills:/app/skills  # Mount skills for hot reload
    
    restart: unless-stopped
    
    # Resource limits (adjust per your hardware)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    
    networks:
      - vmt23-net
    
    # Healthcheck for compose orchestration
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8787/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
    driver: local

networks:
  vmt23-net:
    driver: bridge
